<!-- ═══════════════════════════════════════════════════════════════════════════
     THE ACCESS EXCHANGE - SHARED HEADER
     Elementor → Templates → Theme Builder → Header → "Site Header"
       · Container: Full Width, no padding, no gap, HTML tag = header
       · Inside it, ONE "HTML" widget containing everything in this file
       · Display Conditions: Entire Site
       · Do NOT let Elementor wrap this in a sticky/motion effect - the
         masthead does its own fixed positioning and collapse.

     WHAT IS IN HERE
       1. The SVG icon sprite. It must stay on every page because the page
          bodies reference it (<use href="#i-arrow">, #i-left, #i-right …).
       2. The masthead + the spacer that reserves its height.
       3. The primary nav strip. Visible from 1080px up; below that it collapses
          into the menu panel and the hamburger carries navigation.
       4. The slide-in menu panel.
       5. The search overlay.

     GET INVOLVED is the one persistent CTA and never leaves the bar, at any
     width or scroll position (handoff §7).

     GUESTS and PARTNERSHIPS are two separate top-level pages, at the client's
     request (2026-09-04). They were one combined /guests-partners/ page. Both
     navs below list them separately - keep them adjacent and in this order if
     either list is ever reordered.

     The active nav item is set at runtime by global.js (it compares each href to
     location.pathname, across both navs), so this file stays byte-identical
     site-wide.
     ═══════════════════════════════════════════════════════════════════════════ -->
