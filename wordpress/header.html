<!-- ═══════════════════════════════════════════════════════════════════════════
     THE ACCESS EXCHANGE - SHARED HEADER
     Elementor → Templates → Theme Builder → Header → "Site Header"
       · Container: Full Width, no padding, no gap, HTML tag = header
       · Inside it, ONE "HTML" widget containing everything in this file
       · Display Conditions: Entire Site
       · Do NOT let Elementor wrap this in a sticky/motion effect - the
         masthead does its own fixed positioning and collapse.

     WHAT IS IN HERE
       1. The SVG icon sprite. It must stay on every page because the page
          bodies reference it (<use href="#i-arrow">, #i-left, #i-right …).
       2. The masthead + the spacer that reserves its height.
       3. The primary nav strip. Visible from 1080px up; below that it collapses
          into the menu panel and the hamburger carries navigation.
       4. The slide-in menu panel.
       5. The search overlay.

     GET INVOLVED is the one persistent CTA and never leaves the bar, at any
     width or scroll position (handoff §7).

     The active nav item is set at runtime by global.js (it compares each href to
     location.pathname, across both navs), so this file stays byte-identical
     site-wide.
     ═══════════════════════════════════════════════════════════════════════════ -->

<svg class="sr" aria-hidden="true" focusable="false"><defs>
  <g id="i-menu"><path d="M3 7h18M3 12h18M3 17h18"/></g>
  <g id="i-close"><path d="M5 5l14 14M19 5L5 19"/></g>
  <g id="i-search"><circle cx="10.8" cy="10.8" r="6.8"/><path d="M15.8 15.8L21 21"/></g>
  <g id="i-arrow"><path d="M4 12h15M13 6l6 6-6 6"/></g>
  <g id="i-left"><path d="M15 5l-7 7 7 7"/></g>
  <g id="i-right"><path d="M9 5l7 7-7 7"/></g>
  <g id="b-youtube"><path fill="#FF0000" d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/><path fill="#fff" d="M9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></g>
</defs></svg>

<!-- ═══ MASTHEAD ═══════════════════════════════════════════════════════════ -->
<div class="mast" id="mast">
  <span class="mast-rule" aria-hidden="true"></span>
  <a class="mark" href="/" rel="home">The Access <i>Exchange</i></a>
  <div class="mast-in">
    <div class="mast-l">
      <button type="button" id="menuBtn" aria-expanded="false" aria-controls="veil" aria-label="Open menu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-menu"/></svg>
      </button>
      <button type="button" class="srchbtn" aria-label="Search">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      </button>
    </div>
    <div class="mast-r lab">
      <a href="/get-involved/" class="cta">Get Involved</a>
    </div>
  </div>
  <nav class="mast-nav" aria-label="Primary">
    <a href="/">Home</a>
    <a href="/interview-series/">Interview Series</a>
    <a href="/guests-partners/">Guests &amp; Partners</a>
    <a href="/universities/">Universities</a>
    <a href="/experiences/">Experiences</a>
    <a href="/coaching/">Coaching</a>
    <a href="/about/">About</a>
  </nav>
  <span class="prog" aria-hidden="true"></span>
</div>
<div class="mast-spacer" id="top"></div>

<!-- ═══ MENU PANEL ═════════════════════════════════════════════════════════ -->
<div class="veil" id="veil" role="dialog" aria-modal="true" aria-label="Menu" hidden>
  <div class="veil-panel">
    <div class="veil-top">
      <a class="veil-mark" href="/" rel="home">The Access <i>Exchange</i></a>
      <button type="button" id="veilClose" class="veil-close" aria-label="Close menu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
      </button>
    </div>
    <nav aria-label="Main">
      <ul class="veil-nav">
        <li style="--i:0"><a href="/">Home</a></li>
        <li style="--i:1"><a href="/interview-series/">Interview Series</a></li>
        <li style="--i:2"><a href="/guests-partners/">Guests &amp; Partners</a></li>
        <li style="--i:3"><a href="/universities/">Universities</a></li>
        <li style="--i:4"><a href="/experiences/">Experiences</a></li>
        <li style="--i:5"><a href="/coaching/">Coaching</a></li>
        <li style="--i:6"><a href="/about/">About</a></li>
      </ul>
    </nav>
    <div class="veil-sides veil-sides--one">
      <div class="veil-side">
        <h4 class="lab">Watch</h4>
        <div class="plat-row">
          <a href="https://www.youtube.com/@theaccessexchange" rel="noopener" aria-label="Watch on YouTube"><svg class="bi" viewBox="0 0 24 24" aria-hidden="true"><use href="#b-youtube"/></svg></a>
        </div>
      </div>
    </div>
    <div class="veil-cta">
      <a href="/interview-series/" class="is-ghost">Interviews</a>
      <a href="/get-involved/">Get Involved</a>
    </div>
  </div>
</div>

<!-- ═══ SEARCH OVERLAY ═════════════════════════════════════════════════════ -->
<div class="find" id="find" role="dialog" aria-modal="true" aria-label="Search" hidden>
  <div class="find-box">
    <div class="find-in">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
      <label class="sr" for="findq">Search the site</label>
      <input id="findq" type="search" placeholder="Search interviews, pages, topics" autocomplete="off">
      <kbd>ESC</kbd>
    </div>
    <div class="find-out" id="findout"></div>
  </div>
</div>
